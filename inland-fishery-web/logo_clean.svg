<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top Text Path -->
    <path id="top-text-path" d="M 60,250 A 190,190 0 0,1 440,250" fill="none" />
    
    <!-- Bottom Text Path -->
    <path id="bottom-text-path" d="M 440,250 A 190,190 0 0,1 60,250" fill="none" />
    
    <!-- Mountain Gradient -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b7a3b" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Outer gold rings -->
  <circle cx="250" cy="250" r="240" fill="#0f2b5c" stroke="#e6c86e" stroke-width="6" />
  <circle cx="250" cy="250" r="230" fill="none" stroke="#e6c86e" stroke-width="2" />

  <!-- Inner gold rings & white center -->
  <circle cx="250" cy="250" r="150" fill="#ffffff" stroke="#e6c86e" stroke-width="6" />
  
  <!-- Text -->
  <text font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="900" font-size="28" fill="#e6c86e">
    <textPath href="#top-text-path" startOffset="50%" text-anchor="middle">내수면어로어업 내수경제 활로개척</textPath>
  </text>
  <text font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="900" font-size="28" fill="#e6c86e">
    <textPath href="#bottom-text-path" startOffset="50%" text-anchor="middle">사단법인 전국내수면어로어업인연합회</textPath>
  </text>

  <!-- Separator Dots -->
  <circle cx="58" cy="250" r="6" fill="#e6c86e" />
  <circle cx="442" cy="250" r="6" fill="#e6c86e" />

  <!-- Mountains -->
  <path d="M 170,240 Q 220,130 270,240 Z" fill="url(#mountainGrad)" stroke="#053612" stroke-width="2" />
  <path d="M 240,240 Q 285,160 330,240 Z" fill="url(#mountainGrad)" stroke="#053612" stroke-width="2" />

  <!-- Water -->
  <path d="M 130,280 Q 250,330 370,260" fill="none" stroke="#4c9dd1" stroke-width="3" stroke-linecap="round" />
  <path d="M 170,300 Q 250,340 330,285" fill="none" stroke="#4c9dd1" stroke-width="3" stroke-linecap="round" />

  <!-- Pink Fish -->
  <path d="M 230,210 Q 270,190 310,220 Q 270,230 230,210 Z" fill="#f5b5b5" stroke="#1e293b" stroke-width="2" />
  <!-- Fish Tail Pink -->
  <path d="M 310,220 L 335,210 L 320,235 Z" fill="#f5b5b5" stroke="#1e293b" stroke-width="2" />
  <!-- Eye -->
  <circle cx="245" cy="212" r="2.5" fill="#1e293b" />

  <!-- Blue Fish -->
  <path d="M 190,250 Q 240,220 290,260 Q 240,280 190,250 Z" fill="#84b8e3" stroke="#1e293b" stroke-width="2" />
  <!-- Fish Tail Blue -->
  <path d="M 285,255 L 325,240 L 305,275 Z" fill="#84b8e3" stroke="#1e293b" stroke-width="2" />
  <!-- Eye -->
  <circle cx="210" cy="252" r="2.5" fill="#1e293b" />
</svg>
